<body>
  <!-- 导航栏 -->
  <nav class="nav">
    <div class="container">
      <div class="nav-content">
        <a href="index.html" class="nav-brand">RAG优化策略工坊</a>
        <ul class="nav-links">
          <li><a href="learn.html" class="nav-link">学习</a></li>
          <li><a href="flashcard.html" class="nav-link">闪卡</a></li>
          <li><a href="roots.html" class="nav-link">索引</a></li>
          <li><a href="progress.html" class="nav-link">进度</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero区 -->
  <section class="hero">
    <div class="container">
      <h1 class="hero-title">
        <div>40个核心策略</div>
        <div>掌握RAG优化</div>
        <div>的完整体系</div>
      </h1>
      <p class="hero-subtitle">从查询重写到多模态检索，系统学习检索增强生成的优化技术</p>
      <div class="hero-cta">
        <a href="learn.html" class="btn btn-primary">开始第一个策略 →</a>
        <a href="flashcard.html" class="btn btn-secondary">闪卡复习</a>
      </div>
    </div>
  </section>

  <!-- 统计卡片 -->
  <section class="container">
    <div class="stats-grid">
      <div class="card stat-card">
        <div class="stat-value">40</div>
        <div class="stat-label">优化策略</div>
      </div>
      <div class="card stat-card">
        <div class="stat-value">8大</div>
        <div class="stat-label">技术维度</div>
      </div>
      <div class="card stat-card">
        <div class="stat-value">20分钟</div>
        <div class="stat-label">每日精进</div>
      </div>
    </div>
  </section>

  <!-- 动画演示区 -->
  <section class="demo-section">
    <div class="container">
      <h2 class="demo-title">核心策略预览</h2>
      <div class="demo-cards" id="demoCards">
        <!-- 动态加载前5个策略 -->
      </div>
    </div>
  </section>

  <!-- 底部介绍 -->
  <footer class="spacing-3xl">
    <div class="container-narrow text-center">
      <h2 class="text-3xl font-semibold spacing-lg">让AI检索更精准，生成更可靠</h2>
      <p class="text-lg text-muted spacing-lg">
        基于最新RAG技术发展，涵盖查询优化、分块策略、索引技术、检索方法、生成优化、数据优化六大核心领域。从多查询重写到语义缓存，从HyDE到GraphRAG，掌握构建高性能RAG系统的完整技术栈。
      </p>
      <div class="spacing-lg">
        <a href="learn.html" class="btn btn-primary">开始学习</a>
      </div>
    </div>
  </footer>

  <!-- JavaScript -->
  <script type="module">
    import { WordRoots } from './js/wordData.js';
    import { siteConfig } from './js/siteConfig.js';

    // 动态加载演示卡片
    function loadDemoCards() {
      const demoContainer = document.getElementById('demoCards');
      if (!demoContainer) return;

      const demoCount = siteConfig.hero.animation.demoCount || 5;
      const demoItems = WordRoots.slice(0, demoCount);

      demoContainer.innerHTML = demoItems.map(item => `
        <div class="card demo-card card-interactive" onclick="window.location.href='root-detail.html?id=${item.id}'">
          <div class="demo-card-header">
            <h3 class="demo-card-title">${item.root}</h3>
            <span class="demo-card-category">${item.origin}</span>
          </div>
          <p class="demo-card-description">${item.meaning}</p>
        </div>
      `).join('');
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', loadDemoCards);

    // 注册 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>
</html>
